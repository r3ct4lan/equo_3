; Development only: connect to the IDE only when a request explicitly triggers debugging.
xdebug.mode=debug
xdebug.start_with_request=trigger
xdebug.start_upon_error=no
xdebug.client_host=host.docker.internal
xdebug.client_port=9003
xdebug.discover_client_host=0
; Do not write connection diagnostics containing request details to application logs.
xdebug.log_level=0
