# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/*/Domain/'
            - '../src/*/Adapter/Persistence/Doctrine/Record/'
            - '../src/Infrastructure/*/Persistence/Doctrine/Record/'

    Symfony\Component\PasswordHasher\Hasher\PasswordHasherFactory:
        arguments:
            $passwordHashers:
                App\IdentityAccess\Application\Port\PasswordHashingPort:
                    algorithm: auto

    Symfony\Component\PasswordHasher\Hasher\PasswordHasherFactoryInterface:
        alias: Symfony\Component\PasswordHasher\Hasher\PasswordHasherFactory

    App\IdentityAccess\Application\Port\PasswordHashingPort:
        alias: App\IdentityAccess\Adapter\Security\SymfonyPasswordHasher

    App\IdentityAccess\Domain\User\PasswordPolicy: ~

    App\IdentityAccess\Application\Port\ClockPort:
        alias: App\IdentityAccess\Adapter\System\SystemClock

    App\IdentityAccess\Application\Port\UuidPort:
        alias: App\IdentityAccess\Adapter\System\SymfonyUuid

    App\IdentityAccess\Application\Port\ActionTokenCodecPort:
        alias: App\IdentityAccess\Adapter\Security\VersionedActionTokenCodec

    App\IdentityAccess\Application\Port\IdentityRepositoryPort:
        alias: App\IdentityAccess\Adapter\Persistence\Doctrine\DoctrineIdentityRepository

    App\IdentityAccess\Application\Port\TransactionPort:
        alias: App\IdentityAccess\Adapter\Persistence\Doctrine\DoctrineTransaction

    App\IdentityAccess\Application\Port\IdempotencyPort:
        alias: App\Infrastructure\Idempotency\Persistence\Doctrine\DoctrineIdempotency

    App\IdentityAccess\Application\Port\RequestFingerprintPort:
        alias: App\IdentityAccess\Adapter\Security\VersionedRequestFingerprint

    App\IdentityAccess\Application\Port\AccessTokenIssuerPort:
        alias: App\IdentityAccess\Adapter\Security\Rs256AccessTokenCodec

    App\IdentityAccess\Application\Port\AccessTokenVerifierPort:
        alias: App\IdentityAccess\Adapter\Security\Rs256AccessTokenCodec

    App\IdentityAccess\Application\Port\RefreshTokenCodecPort:
        alias: App\IdentityAccess\Adapter\Security\RefreshTokenCodec

    App\IdentityAccess\Application\Port\CsrfTokenCodecPort:
        alias: App\IdentityAccess\Adapter\Security\VersionedCsrfTokenCodec

    App\IdentityAccess\Application\Port\EmailOutboxPort:
        alias: App\Infrastructure\EmailDelivery\Persistence\Doctrine\DoctrineEmailOutbox

    App\IdentityAccess\Application\Port\PayloadCipherPort:
        alias: App\Infrastructure\EmailDelivery\Security\PayloadCipher

    App\IdentityAccess\Application\Port\RateLimitPort:
        alias: App\IdentityAccess\Adapter\Security\SymfonyRateLimit

    App\IdentityAccess\Application\Api\TokenDeliveryQuery:
        alias: App\IdentityAccess\Application\Api\DoctrineTokenDeliveryQuery

    App\IdentityAccess\Adapter\Security\VersionedActionTokenCodec:
        arguments:
            $activeVersion: '%env(ACTION_TOKEN_ACTIVE_VERSION)%'
            $encodedKeyRing: '%env(ACTION_TOKEN_HMAC_KEYS)%'

    App\IdentityAccess\Adapter\Security\VersionedRequestFingerprint:
        arguments:
            $activeVersion: '%env(IDEMPOTENCY_FINGERPRINT_ACTIVE_VERSION)%'
            $encodedKeyRing: '%env(IDEMPOTENCY_FINGERPRINT_HMAC_KEYS)%'

    App\IdentityAccess\Adapter\Security\Rs256AccessTokenCodec:
        arguments:
            $activeKeyVersion: '%env(EQUO_JWT_SIGNING_KEY_VERSION)%'
            $encodedSigningPrivateKey: '%env(EQUO_JWT_SIGNING_PRIVATE_KEY)%'
            $encodedPublicKeyRing: '%env(EQUO_JWT_PUBLIC_KEY_RING)%'
            $issuer: '%env(EQUO_JWT_ISSUER)%'
            $audience: '%env(EQUO_JWT_AUDIENCE)%'
            $accessTtlSeconds: '%env(int:EQUO_JWT_ACCESS_TTL_SECONDS)%'
            $clockSkewSeconds: '%env(int:EQUO_JWT_CLOCK_SKEW_SECONDS)%'

    App\IdentityAccess\Adapter\Security\VersionedCsrfTokenCodec:
        arguments:
            $activeVersion: '%env(EQUO_CSRF_SIGNING_KEY_VERSION)%'
            $encodedKeyRing: '%env(EQUO_CSRF_SIGNING_KEY_RING)%'

    App\Infrastructure\EmailDelivery\Security\PayloadCipher:
        arguments:
            $encodedKey: '%env(EMAIL_PAYLOAD_KEY)%'

    App\IdentityAccess\Adapter\Security\SymfonyRateLimit:
        arguments:
            $registrationIpLimiter: '@limiter.registration_ip'
            $registrationEmailLimiter: '@limiter.registration_email'
            $activationIpLimiter: '@limiter.activation_ip'
            $activationTokenLimiter: '@limiter.activation_token'

    App\Infrastructure\EmailDelivery\Messaging\SendUserActionEmailHandler:
        arguments:
            $mailerTransport: '@mailer.default_transport'
            $frontendBaseUrl: '%env(FRONTEND_BASE_URL)%'
            $fromAddress: '%env(MAILER_FROM)%'

    App\Infrastructure\Http\ApiExceptionSubscriber:
        arguments:
            $logger: '@monolog.logger.api'
