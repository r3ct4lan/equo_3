services:
    App\IdentityAccess\Application\Port\LoginThrottlePort:
        alias: App\Tests\Fixture\Security\InMemoryLoginThrottle

    App\Tests\Fixture\Security\InMemoryLoginThrottle:
        autowire: true

    test.rate_limiter_cache:
        alias: cache.rate_limiter
        public: true

    test.register_user:
        alias: App\IdentityAccess\Application\Register\RegisterUser
        public: true

    test.activate_account:
        alias: App\IdentityAccess\Application\Activate\ActivateAccount
        public: true

    test.request_activation:
        alias: App\IdentityAccess\Application\ActivationRequest\RequestActivation
        public: true

    test.login_user:
        alias: App\IdentityAccess\Application\Login\LoginUser
        public: true

    App\IdentityAccess\Application\Port\ActionTokenCodecPort:
        alias: App\IdentityAccess\Adapter\Security\VersionedActionTokenCodec
        public: true

    App\IdentityAccess\Application\Port\RequestFingerprintPort:
        alias: App\IdentityAccess\Adapter\Security\VersionedRequestFingerprint
        public: true

    App\IdentityAccess\Application\Port\AccessTokenIssuerPort:
        alias: App\IdentityAccess\Adapter\Security\Rs256AccessTokenCodec
        public: true

    App\IdentityAccess\Application\Port\AccessTokenVerifierPort:
        alias: App\IdentityAccess\Adapter\Security\Rs256AccessTokenCodec
        public: true

    App\IdentityAccess\Application\Port\RefreshTokenCodecPort:
        alias: App\IdentityAccess\Adapter\Security\RefreshTokenCodec
        public: true

    App\IdentityAccess\Application\Port\CsrfTokenCodecPort:
        alias: App\IdentityAccess\Adapter\Security\VersionedCsrfTokenCodec
        public: true

    App\IdentityAccess\Application\Port\UserSessionRepositoryPort:
        alias: App\IdentityAccess\Adapter\Persistence\Doctrine\DoctrineUserSessionRepository
        public: true

    App\IdentityAccess\Application\Port\PasswordHashingPort:
        alias: App\IdentityAccess\Adapter\Security\SymfonyPasswordHasher
        public: true

    App\Infrastructure\EmailDelivery\Security\PayloadCipher:
        arguments:
            $encodedKey: '%env(EMAIL_PAYLOAD_KEY)%'
        public: true

    App\Tests\Fixture\Http\HttpInfrastructureController:
        autowire: true
        autoconfigure: true
        public: true
        tags: ['controller.service_arguments']

    test.invitation_service:
        alias: App\Invitations\Application\InvitationService
        public: true
    test.connect_service:
        alias: App\Connects\Application\ConnectService
        public: true
    test.create_connect:
        alias: App\Connects\Application\CreateConnect
        public: true

    test.create_debt:
        alias: App\Debts\Application\CreateDebt
        public: true
    test.debt_repository:
        alias: App\Debts\Application\Port\DebtRepositoryPort
        public: true
    test.debt_views:
        alias: App\Debts\Application\DebtViews
        public: true

    test.create_manual_transfer:
        alias: App\Transfers\Application\CreateManualTransfer
        public: true
    test.update_manual_transfer:
        alias: App\Transfers\Application\UpdateManualTransfer
        public: true
    test.delete_manual_transfer:
        alias: App\Transfers\Application\DeleteManualTransfer
        public: true

    test.update_debt:
        alias: App\Debts\Application\UpdateDebt
        public: true
    test.delete_debt:
        alias: App\Debts\Application\DeleteDebt
        public: true
