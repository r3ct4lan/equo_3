doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        server_version: '17'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: false
        mappings:
            IdentityAccess:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/IdentityAccess/Adapter/Persistence/Doctrine/Record'
                prefix: 'App\IdentityAccess\Adapter\Persistence\Doctrine\Record'
                alias: IdentityAccess
            Connects:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Connects/Adapter/Persistence/Doctrine/Record'
                prefix: 'App\Connects\Adapter\Persistence\Doctrine\Record'
                alias: Connects
            Invitations:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Invitations/Adapter/Persistence/Doctrine/Record'
                prefix: 'App\Invitations\Adapter\Persistence\Doctrine\Record'
                alias: Invitations
            Debts:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Debts/Adapter/Persistence/Doctrine/Record'
                prefix: 'App\Debts\Adapter\Persistence\Doctrine\Record'
                alias: Debts
            Transfers:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Transfers/Adapter/Persistence/Doctrine/Record'
                prefix: 'App\Transfers\Adapter\Persistence\Doctrine\Record'
                alias: Transfers
            InfrastructureIdempotency:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Infrastructure/Idempotency/Persistence/Doctrine/Record'
                prefix: 'App\Infrastructure\Idempotency\Persistence\Doctrine\Record'
                alias: InfrastructureIdempotency
            InfrastructureEmailDelivery:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Infrastructure/EmailDelivery/Persistence/Doctrine/Record'
                prefix: 'App\Infrastructure\EmailDelivery\Persistence\Doctrine\Record'
                alias: InfrastructureEmailDelivery

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
