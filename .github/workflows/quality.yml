name: Quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  APP_DEBUG: '1'
  APP_RUNTIME_OPTIONS: '{"disable_dotenv":true}'
  APP_SECRET: ci_test_only_not_a_production_secret
  POSTGRES_DB: equo
  POSTGRES_USER: equo
  POSTGRES_PASSWORD: ci_postgres_test_only
  RABBITMQ_DEFAULT_USER: equo
  RABBITMQ_DEFAULT_PASS: ci_rabbitmq_test_only
  BACKEND_DATABASE_URL: postgresql://equo:ci_postgres_test_only@postgres:5432/equo?serverVersion=17&charset=utf8
  BACKEND_MESSENGER_TRANSPORT_DSN: amqp://equo:ci_rabbitmq_test_only@rabbitmq:5672/%2f/messages
  BACKEND_REDIS_URL: redis://redis:6379
  BACKEND_MAILER_DSN: smtp://mailpit:1025
  DATABASE_URL: postgresql://equo_ci:equo_ci_only@127.0.0.1:5432/equo_ci?serverVersion=17&charset=utf8
  MESSENGER_TRANSPORT_DSN: in-memory://
  MAILER_DSN: null://null
  MAILER_FROM: no-reply@equo.test
  REDIS_URL: redis://127.0.0.1:6379
  TRUSTED_PROXIES: 127.0.0.1
  DEFAULT_URI: http://localhost
  FRONTEND_BASE_URL: http://localhost
  EQUO_REGISTRATION_IP_LIMIT: '5'
  EQUO_REGISTRATION_EMAIL_LIMIT: '3'
  EQUO_ACTIVATION_REQUEST_IP_LIMIT: '20'
  EQUO_ACTIVATION_REQUEST_EMAIL_LIMIT: '3'
  EQUO_ACTIVATION_IP_LIMIT: '10'
  EQUO_ACTIVATION_TOKEN_LIMIT: '5'
  EQUO_LOGIN_FAILURE_LIMIT: '5'
  EQUO_LOGIN_COOLDOWN_SECONDS: '60'
  ACTION_TOKEN_ACTIVE_VERSION: v1
  ACTION_TOKEN_HMAC_KEYS: '{"v1":"YWN0aW9uLXRva2VuLWNpLWtleS0zMi1ieXRlcyEhISE="}'
  IDEMPOTENCY_FINGERPRINT_ACTIVE_VERSION: v1
  IDEMPOTENCY_FINGERPRINT_HMAC_KEYS: '{"v1":"aWRlbXBvdGVuY3ktZmluZ2VycHJpbnQtY2kta2V5LTMyISEh"}'
  EMAIL_PAYLOAD_KEY: ZW1haWwtcGF5bG9hZC1kZXYta2V5LTMyLWJ5dGVzISE=
  EQUO_JWT_SIGNING_KEY_VERSION: v1
  EQUO_JWT_SIGNING_PRIVATE_KEY: base64-encoded-rsa-private-key-placeholder
  EQUO_JWT_PUBLIC_KEY_RING: '{"v1":"base64-encoded-rsa-public-key-placeholder"}'
  EQUO_JWT_ISSUER: https://equo.test
  EQUO_JWT_AUDIENCE: equo-api
  EQUO_JWT_ACCESS_TTL_SECONDS: '900'
  EQUO_JWT_CLOCK_SKEW_SECONDS: '30'
  EQUO_CSRF_SIGNING_KEY_VERSION: v1
  EQUO_CSRF_SIGNING_KEY_RING: '{"v1":"base64-encoded-32-byte-csrf-key-placeholder"}'
  EQUO_APPLICATION_ORIGIN: https://equo.test
  EQUO_INVITATION_SIGNING_VERSION: v1
  EQUO_INVITATION_SIGNING_KEYS: '{"v1":"ZGV2LW9ubHktaW52aXRhdGlvbi1zaWduaW5nLWtleS0zMi1ieXRlcw=="}'

jobs:
  repository-quality:
    name: Repository quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify required Compose services
        run: ./scripts/check-compose-services.sh
      - name: Scan tracked files for common secret patterns
        run: ./scripts/check-secrets.sh
      - name: Verify checks leave no generated changes
        run: ./scripts/check-worktree-clean.sh

  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4.27'
          extensions: amqp, ctype, iconv, intl, pdo_pgsql, redis, sockets
          coverage: none
          tools: composer:v2
      - name: Resolve Composer cache directory
        id: composer-cache
        working-directory: backend
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Cache Composer downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php84-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php84-
      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts
      - name: Run backend quality checks
        working-directory: backend
        run: composer check
      - name: Verify checks leave no generated changes
        run: ./scripts/check-worktree-clean.sh

  backend-tests:
    name: Backend tests and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: equo_ci_test
          POSTGRES_USER: equo_ci
          POSTGRES_PASSWORD: equo_ci_only
        options: >-
          --health-cmd "pg_isready -U equo_ci -d equo_ci_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 6379:6379
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4.27'
          extensions: amqp, ctype, iconv, intl, pdo_pgsql, redis, sockets
          coverage: none
          tools: composer:v2
      - name: Resolve Composer cache directory
        id: composer-cache
        working-directory: backend
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Cache Composer downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php84-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php84-
      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts
      - name: Apply migrations to the empty database
        working-directory: backend
        run: composer check:migrations
      - name: Generate ephemeral test signing keys
        run: |
          umask 077
          key_dir=$(mktemp -d)
          trap 'rm -rf "$key_dir"' EXIT
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$key_dir/private.pem" >/dev/null 2>&1
          openssl pkey -in "$key_dir/private.pem" -pubout -out "$key_dir/public.pem" >/dev/null 2>&1
          printf 'EQUO_JWT_SIGNING_PRIVATE_KEY=%s\n' "$(base64 -w 0 < "$key_dir/private.pem")" >> "$GITHUB_ENV"
          printf 'EQUO_JWT_PUBLIC_KEY_RING={"v1":"%s"}\n' "$(base64 -w 0 < "$key_dir/public.pem")" >> "$GITHUB_ENV"
          printf 'EQUO_CSRF_SIGNING_KEY_RING={"v1":"%s"}\n' "$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
      - name: Run PHPUnit
        working-directory: backend
        run: composer test
      - name: Verify checks leave no generated changes
        run: ./scripts/check-worktree-clean.sh

  frontend-quality:
    name: Frontend quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Use the repository npm version
        run: npm install --global npm@11.6.2
      - name: Install frontend dependencies from lock file
        working-directory: frontend
        run: npm ci
      - name: Run frontend quality, tests, and production build
        working-directory: frontend
        run: npm run check
      - name: Verify checks leave no generated changes
        run: ./scripts/check-worktree-clean.sh

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4.27'
          coverage: none
          tools: composer:v2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit Composer lock file
        working-directory: backend
        run: composer audit --locked
      - name: Audit npm lock file
        working-directory: frontend
        run: npm run audit

  full-mvp-browser-e2e:
    name: Full MVP browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build cached Playwright image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/e2e/Dockerfile
          load: true
          tags: equo-3-e2e-browser:ci
          cache-from: type=gha,scope=equo-e2e-browser
          cache-to: type=gha,scope=equo-e2e-browser,mode=max,ignore-error=true
      - name: Run isolated auth, invitation and financial user journeys
        run: make test-e2e
        env:
          E2E_PREBUILT_BROWSER_IMAGE: '1'
      - name: Upload redacted browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: full-mvp-browser-e2e-${{ github.run_attempt }}
          path: frontend/test-results/**/browser-diagnostics*
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify checks leave no generated changes
        if: always()
        run: ./scripts/check-worktree-clean.sh

  smoke:
    name: Application smoke
    needs:
      - backend-quality
      - backend-tests
      - frontend-quality
      - repository-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_PORT: '8080'
      POSTGRES_DB: equo_ci_smoke_test
      POSTGRES_USER: equo_ci
      POSTGRES_PASSWORD: equo_ci_only
      BACKEND_DATABASE_URL: postgresql://equo_ci:equo_ci_only@postgres:5432/equo_ci_smoke?serverVersion=17&charset=utf8
      RABBITMQ_DEFAULT_USER: equo_ci
      RABBITMQ_DEFAULT_PASS: equo_ci_only
      NUXT_PUBLIC_API_BASE: /api
      NUXT_API_INTERNAL_BASE: http://nginx/api
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and start the isolated Compose stack
        run: docker compose up -d --build --wait
      - name: Smoke-test frontend and API through Nginx
        run: make smoke
      - name: Show service logs after failure
        if: failure()
        run: docker compose logs --no-color
      - name: Verify checks leave no generated changes
        run: ./scripts/check-worktree-clean.sh
      - name: Stop the isolated Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans
