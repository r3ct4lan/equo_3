services:
  backend:
    environment:
      DEFAULT_URI: "http://127.0.0.1:${DEMO_HTTP_PORT:-18080}"
      FRONTEND_BASE_URL: "http://127.0.0.1:${DEMO_HTTP_PORT:-18080}"

  worker:
    environment:
      DEFAULT_URI: "http://127.0.0.1:${DEMO_HTTP_PORT:-18080}"
      FRONTEND_BASE_URL: "http://127.0.0.1:${DEMO_HTTP_PORT:-18080}"

  nginx:
    ports:
      - "127.0.0.1:${DEMO_HTTP_PORT:-18080}:80"

  mailpit:
    ports:
      - "127.0.0.1:${DEMO_MAILPIT_PORT:-18025}:8025"
