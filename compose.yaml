name: equo-3

services:
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/backend/public:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks: [equo]

  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    restart: unless-stopped
    environment: &backend-environment
      APP_ENV: "${APP_ENV:-dev}"
      APP_RUNTIME_OPTIONS: '{"disable_dotenv":true}'
      APP_SECRET: "${APP_SECRET:-change-me-in-local-env}"
      DATABASE_URL: "${BACKEND_DATABASE_URL:-postgresql://${POSTGRES_USER:-equo}:${POSTGRES_PASSWORD:-equo}@postgres:5432/${POSTGRES_DB:-equo}?serverVersion=17&charset=utf8}"
      MESSENGER_TRANSPORT_DSN: "amqp://${RABBITMQ_DEFAULT_USER:-equo}:${RABBITMQ_DEFAULT_PASS:-equo}@rabbitmq:5672/%2f/messages"
      REDIS_URL: "redis://redis:6379"
      MAILER_DSN: "smtp://mailpit:1025"
      MAILER_FROM: "no-reply@equo.local"
      TRUSTED_PROXIES: "127.0.0.1,172.16.0.0/12"
      DEFAULT_URI: "${DEFAULT_URI:-http://localhost}"
      FRONTEND_BASE_URL: "${FRONTEND_BASE_URL:-http://localhost}"
      ACTION_TOKEN_ACTIVE_VERSION: "v1"
      ACTION_TOKEN_HMAC_KEYS: '{"v1":"YWN0aW9uLXRva2VuLWRldi1rZXktMzItYnl0ZXMhISE="}'
      IDEMPOTENCY_FINGERPRINT_ACTIVE_VERSION: "v1"
      IDEMPOTENCY_FINGERPRINT_HMAC_KEYS: '{"v1":"aWRlbXBvdGVuY3ktZmluZ2VycHJpbnQtZGV2LWtleS0zMiEh"}'
      EMAIL_PAYLOAD_KEY: "ZW1haWwtcGF5bG9hZC1kZXYta2V5LTMyLWJ5dGVzISE="
      EQUO_JWT_SIGNING_KEY_VERSION: "v1"
      EQUO_JWT_SIGNING_PRIVATE_KEY: "base64-encoded-rsa-private-key-placeholder"
      EQUO_JWT_PUBLIC_KEY_RING: '{"v1":"base64-encoded-rsa-public-key-placeholder"}'
      EQUO_JWT_ISSUER: "https://equo.local"
      EQUO_JWT_AUDIENCE: "equo-api"
      EQUO_JWT_ACCESS_TTL_SECONDS: "900"
      EQUO_JWT_CLOCK_SKEW_SECONDS: "30"
      EQUO_CSRF_SIGNING_KEY_VERSION: "v1"
      EQUO_CSRF_SIGNING_KEY_RING: '{"v1":"base64-encoded-32-byte-csrf-key-placeholder"}'
    volumes: &backend-volumes
      - ./backend:/var/www/backend
      - backend_vendor:/var/www/backend/vendor
      - backend_var:/var/www/backend/var
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [equo]

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      CHOKIDAR_USEPOLLING: "${CHOKIDAR_USEPOLLING:-true}"
      WATCHPACK_POLLING: "${WATCHPACK_POLLING:-true}"
      NUXT_PUBLIC_API_BASE: "${NUXT_PUBLIC_API_BASE:-/api}"
      NUXT_API_INTERNAL_BASE: "${NUXT_API_INTERNAL_BASE:-http://nginx/api}"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_nuxt:/app/.nuxt
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [equo]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-equo}"
      POSTGRES_USER: "${POSTGRES_USER:-equo}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-equo}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-equo} -d ${POSTGRES_DB:-equo}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [equo]

  postgres-test:
    image: postgres:17-alpine
    profiles: [quality]
    environment:
      POSTGRES_DB: equo_test
      POSTGRES_USER: equo_test
      POSTGRES_PASSWORD: equo_test_only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U equo_test -d equo_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    networks: [equo]

  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [equo]

  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:-equo}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:-equo}"
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [equo]

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    restart: unless-stopped
    command:
      - sh
      - -lc
      - >-
        while true; do
          php bin/console app:email-outbox:relay --no-interaction;
          php bin/console messenger:consume async --time-limit=5 --memory-limit=256M -vv;
        done
    environment: *backend-environment
    volumes: *backend-volumes
    depends_on:
      backend:
        condition: service_healthy
    networks: [equo]

  mailpit:
    image: axllent/mailpit:v1.28
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [equo]

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  backend_vendor:
  backend_var:
  frontend_node_modules:
  frontend_nuxt:

networks:
  equo:
    driver: bridge
